{% extends "catalog/base.html" %}
{% block content %}
<div class="container mt-4">
    <h2 class="text-center mb-4">
        Форма авторизации
    </h2>
    <div class="row justify-content-center">
        <div class="col-md-6">
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary">
                    Войти
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
