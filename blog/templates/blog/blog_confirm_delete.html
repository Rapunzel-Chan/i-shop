{% extends 'blog/base.html' %}
{% block title %}Подтвердите удаление{% endblock %}
{% block content %}
<h1>Удаление записи</h1>
<p>Вы уверены, что хотите удалить "{{ object.title }}"?</p>
<form method="post">
  {% csrf_token %}
  <button type="submit" class="btn btn-danger">Да, удалить</button>
  <a href="{% url 'blog:blog_detail' object.pk %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
